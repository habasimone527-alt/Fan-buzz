<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FANBASE</title>
<style>
:root{--bg:#0b0b0b;--card:#161616;--line:#2a2a2a;--txt:#f2f2f2;--mut:#9a9a9a;--acc:#ff6a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:2px;color:var(--acc)}
h1{font-size:1.6rem;margin:.4em 0}
h2{font-size:1.1rem;margin:1.6em 0 .6em;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card img.av{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#222}
.card .in{padding:10px 12px}
.ph{width:100%;aspect-ratio:1;background:#222;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--acc)}
.cover{height:150px;background:#222 center/cover no-repeat;border-radius:12px}
.hero{display:flex;gap:14px;align-items:center;margin-top:-34px;padding:0 12px}
.hero .av{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:#222}
.post{padding:14px;margin-bottom:12px}
.post img{width:100%;border-radius:8px;margin:8px 0;display:block}
.btn{display:inline-block;background:var(--acc);color:#000;font-weight:700;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0f0f0f;color:var(--txt);font-size:1rem;margin-bottom:8px}
.ev{display:flex;gap:12px;align-items:center;padding:12px}
.date{min-width:54px;text-align:center;color:var(--acc);font-weight:800;line-height:1.1}
.msg{margin:.5em 0}
.ok{color:#4ade80}.ko{color:#f87171}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
  </html>
